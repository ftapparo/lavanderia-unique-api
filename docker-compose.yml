services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lavanderia-unique-api
    restart: unless-stopped
    ports:
      - "${API_PORT}:${API_PORT}"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required in Portainer}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required in Portainer}
    networks:
      - lavanderia-unique-network
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --quiet --tries=1 --spider http://localhost:${API_PORT}/v1/api/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  lavanderia-unique-network:
    name: lavanderia-unique-network
