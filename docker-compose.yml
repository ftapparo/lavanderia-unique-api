services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lavanderia-unique-api
    restart: unless-stopped
    ports:
      - "${CONTAINER_PORT}:${API_PORT}"
    networks:
      - lavanderia-unique-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:$${API_PORT}/v1/api/healthcheck || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 45s

networks:
  lavanderia-unique-network:
    external: true
    name: lavanderia-unique-network
