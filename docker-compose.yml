services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lavanderia-unique-api
    restart: unless-stopped
    ports:
      - "${CONTAINER_PORT}:${API_PORT}"
    environment:
      - PORT=${API_PORT}
      - NODE_ENV=${NODE_ENV}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required in Portainer}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required in Portainer}
      - JWT_ACCESS_TTL_SECONDS=${JWT_ACCESS_TTL_SECONDS}
      - JWT_REFRESH_TTL_SECONDS=${JWT_REFRESH_TTL_SECONDS}
      - BILLING_MODE=${BILLING_MODE}
      - PRICE_PER_USE=${PRICE_PER_USE}
      - PRICE_PER_KWH=${PRICE_PER_KWH}
      - CHECKIN_TOLERANCE_MINUTES=${CHECKIN_TOLERANCE_MINUTES}
    networks:
      - lavanderia-unique-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:$${PORT}/v1/api/healthcheck || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 45s

networks:
  lavanderia-unique-network:
    external: true
    name: lavanderia-unique-network
