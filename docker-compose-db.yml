services:
  postgres:
    image: postgres:16-alpine
    container_name: lavanderia-unique-db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - lavanderia-unique-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - lavanderia-unique-network

volumes:
  lavanderia-unique-postgres-data:
    name: lavanderia-unique-postgres-data

networks:
  lavanderia-unique-network:
    external: true
    name: lavanderia-unique-network
